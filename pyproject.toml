[project]
name = "spimdisasm"
# Version should be synced with spimdisasm/__init__.py
version = "1.42.3"
description = "MIPS disassembler"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
authors = [
    { name="Anghelo Carvajal", email="angheloalf95@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",

    "License :: OSI Approved :: MIT License",

    "Topic :: Software Development :: Disassemblers",

    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",

    "Typing :: Typed",
]
dynamic = ["dependencies"]

[project.urls]
Repository = "https://github.com/Decompollaborate/spimdisasm"
Issues = "https://github.com/Decompollaborate/spimdisasm/issues"
Changelog = "https://github.com/Decompollaborate/spimdisasm/blob/-/CHANGELOG.md"

[build-system]
requires = ["twine>=6.1.0", "setuptools>=79.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
spimdisasm = "spimdisasm.frontendCommon.FrontendUtilities:cliMain"
singleFileDisasm = "spimdisasm.singleFileDisasm:disassemblerMain"
disasmdis = "spimdisasm.disasmdis:disasmdisMain"
elfObjDisasm = "spimdisasm.elfObjDisasm:elfObjDisasmMain"
rspDisasm = "spimdisasm.rspDisasm:rspDisasmMain"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["build*"]

[tool.setuptools.dynamic]
dependencies = {file = "requirements.txt"}

[tool.setuptools.package-data]
spimdisasm = ["py.typed"]

[tool.cibuildwheel]
skip = ["cp36-*"]

[tool.ruff.lint]
ignore = [
    "C408", # https://docs.astral.sh/ruff/rules/unnecessary-collection-call/
    "EXE001", # https://docs.astral.sh/ruff/rules/shebang-not-executable/
    "EXE005", # https://docs.astral.sh/ruff/rules/shebang-not-first-line/
    "I001", # https://docs.astral.sh/ruff/rules/unsorted-imports/
    "N999", # https://docs.astral.sh/ruff/rules/invalid-module-name/
    "SIM102", # https://docs.astral.sh/ruff/rules/collapsible-if/
    "SIM103", # https://docs.astral.sh/ruff/rules/needless-bool/
    "SIM114", # https://docs.astral.sh/ruff/rules/if-with-same-arms/

    "PLR1711", # [*] Useless `return` statement at end of function
    "RUF015", # https://docs.astral.sh/ruff/rules/unnecessary-iterable-allocation-for-first-element/
    "B023", # ?? https://docs.astral.sh/ruff/rules/function-uses-loop-variable/
    "PIE790", # https://docs.astral.sh/ruff/rules/unnecessary-placeholder/
    "PIE808", # https://docs.astral.sh/ruff/rules/unnecessary-range-start/
    "PLR1730", # https://docs.astral.sh/ruff/rules/if-stmt-min-max/
    "SIM113", # https://docs.astral.sh/ruff/rules/enumerate-for-loop/
    "RUF010", # https://docs.astral.sh/ruff/rules/explicit-f-string-type-conversion/
    "PERF102", # https://docs.astral.sh/ruff/rules/incorrect-dict-iterator/
    "B006", # https://docs.astral.sh/ruff/rules/mutable-argument-default/
    "UP035", # https://docs.astral.sh/ruff/rules/deprecated-import/
    "PERF402", # https://docs.astral.sh/ruff/rules/manual-list-copy/
    "PLR1722", # https://docs.astral.sh/ruff/rules/sys-exit-alias/
    "PYI055", # https://docs.astral.sh/ruff/rules/unnecessary-type-union/
    "UP028", # https://docs.astral.sh/ruff/rules/yield-in-for-loop/
    "RUF012", # https://docs.astral.sh/ruff/rules/mutable-class-default/
    "PIE796", # https://docs.astral.sh/ruff/rules/non-unique-enums/
    "PLR2044", # https://docs.astral.sh/ruff/rules/empty-comment/
    "BLE001", # https://docs.astral.sh/ruff/rules/blind-except/
    "FURB122", # https://docs.astral.sh/ruff/rules/for-loop-writes/
    "UP037", # https://docs.astral.sh/ruff/rules/quoted-annotation/
    "RET501", # https://docs.astral.sh/ruff/rules/unnecessary-return-none/
]
