[package]
name = "spimdisasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "MIPS disassembler"
readme = "README.md"
# keywords = ["MIPS", "disassembler"]
categories = ["no-std"]

# Use https://github.com/foresterre/cargo-msrv to check the MSRV
# ```
# cargo install cargo-msrv --locked
# cargo msrv find -- cargo check -p spimdisasm
# ```
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "spimdisasm"
path = "src/lib.rs"

[features]
default = []
std = ["rabbitizer/std"]
hash_tables = ["std"]

nightly = [] # Evil stuff, do not use.
game_tests = [] # Tests that require game roms to run
pyo3 = [
    "std",
    "dep:pyo3",
    "rabbitizer/pyo3",
]

[dependencies]
rabbitizer = { version = "=2.0.0-alpha.9", features = ["MIPS_IV", "all_extensions"] }
# rabbitizer = { git = "https://github.com/Decompollaborate/rabbitizer.git", branch = "🦀", version = "=2.0.0-alpha.9", features = ["MIPS_IV", "all_extensions"] }
# rabbitizer = { path = "../../../rabbitizer/src/rabbitizer", features = ["MIPS_IV", "all_extensions"] }
address_space = { version = "0.2", features = ["try_from", "error"] }
addended_ordered_map = { version = "0.1" }

polonius-the-crab = "0" # TODO: get rid of the polonius stuff when the new borrow checker has been released.
encoding_rs = "0.8"
bitflags = { version = "2", default-features = false }

pyo3 = { version = "0.28", optional = true }

[dev-dependencies]
pretty_assertions = "1"
